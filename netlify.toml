[build]
  publish = "dist"
  command = "npx expo export --platform web"

[build.environment]
  EXPO_PUBLIC_API_BASE_URL = "https://api.stamping.io/exec/"
  EXPO_PUBLIC_API_KEY = "86e8a39e03fd23ea87a878fcc1a2cc6293899fda6701b26a29c4169d84f"
  EXPO_PUBLIC_SCOPE = "dev"
  EXPO_PUBLIC_SEND_OTP_PROCESS_ID = "ae8ddee1-f2d9-4ada-ba62-7e37708134a6"
  EXPO_PUBLIC_CREATE_ACCOUNT_PROCESS_ID = "32eab051-6e18-42f9-95af-095004cc47d5"

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"

[[headers]]
  for = "*.ttf"
  [headers.values]
    Content-Type = "font/ttf"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "*.woff"
  [headers.values]
    Content-Type = "font/woff"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "*.woff2"
  [headers.values]
    Content-Type = "font/woff2"
    Access-Control-Allow-Origin = "*"
